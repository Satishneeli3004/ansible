
---
# tasks file for apache2

  - name: apache installation
    ansible.builtin.apt:
      name: apache2
      state: present
      update_cache: yes
  - name: Copy the index static web file
    ansible.builtin.copy:
      src: files/index.html
      dest: /var/www/html/
      owner: root
      group: root
      mode: '0644'
    notify:
    - Restart apache2
